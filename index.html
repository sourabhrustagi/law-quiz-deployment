  <style>
    /* First-paint splash so users see the brand, not a white screen,
       during the Flutter engine boot. Removed once Flutter renders. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FBFAF8; color: #1A2233;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .3s ease; z-index: 2147483647;
    }
    #boot .name { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
    #boot .sub  { font-size: 13px; color: #6B7688; }
    #boot .ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(0,0,0,.10); border-top-color: #C08A2E;
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div class="name">JurisQuiz</div>
    <div class="sub">All India Bar Examination preparation</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
